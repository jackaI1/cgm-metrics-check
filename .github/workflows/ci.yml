name: CI
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python scripts/reproduce.py
      - run: git diff --exit-code -- reports/
      - run: python -m build
      - name: Exercise the installed command
        run: >-
          cgm-check data/cgmacros_001.csv
          --start 2020-05-01T10:30:00+00:00
          --end 2020-05-15T10:30:00+00:00
          --cadence-minutes 1 --out out
